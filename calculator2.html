<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher — Glyph Calculator</title>
<style>
  :root{
    --void:#0a0a0c;
    --bone:#e9e5da;
    --bone-dim:#8b8779;
    --ember:#c9a04e;
    --line:#2a2a2e;
    --shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:
      radial-gradient(1200px 700px at 50% -10%, #1a1a1f 0%, var(--void) 55%),
      var(--void);
    color:var(--bone);
    font-family: 'Iowan Old Style','Palatino Linotype', Georgia, serif;
    display:flex; align-items:center; justify-content:center;
    padding: 24px 0;
  }
  .stage{
    width:min(94vw, 420px);
    padding:28px 22px 26px;
    border-radius:28px;
    background: linear-gradient(180deg, #131316 0%, #0d0d0f 100%);
    border:1px solid var(--line);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
    position:relative;
  }
  .stage::before{
    content:"";
    position:absolute; inset:-1px;
    border-radius:28px;
    padding:1px;
    background: linear-gradient(160deg, rgba(201,160,78,.35), transparent 30%, transparent 70%, rgba(201,160,78,.15));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px; padding:0 2px;
  }
  .brand-name{
    letter-spacing:.32em; font-size:11px; text-transform:uppercase;
    color:var(--bone-dim);
  }
  .brand-mark{ color:var(--ember); font-size:14px; }

  .display{
    background: #08080a;
    border:1px solid var(--line);
    border-radius:16px;
    min-height:120px;
    padding:12px 16px 10px;
    margin-bottom:18px;
    display:flex; flex-direction:column; justify-content:flex-end; gap:6px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .display-ghost{
    font-size:12px; letter-spacing:.08em; color:var(--bone-dim);
    min-height:14px; text-align:right; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis;
  }
  .display-main{
    display:flex; align-items:center; justify-content:flex-end;
    gap:2px; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden;
    min-height:64px;
    scrollbar-width:none;
  }
  .display-main::-webkit-scrollbar{ display:none; }
  .display-main img{ height:58px; width:auto; flex:none; display:block; }
  .display-main .op-char, .display-main .dot-char{
    font-size:28px; color:var(--ember); padding:0 4px; line-height:1; flex:none;
  }

  .pad{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:9px;
  }
  button{
    appearance:none; border:none; cursor:pointer;
    font-family:inherit;
    border-radius:14px;
    height:68px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(180deg, #1b1b1f 0%, #131316 100%);
    border:1px solid var(--line);
    color:var(--bone);
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset;
  }
  button:active{ transform: scale(.94); background:#0c0c0e; }
  button img{ height:44px; width:auto; max-width:80%; object-fit:contain; }
  button.op{ color:var(--ember); font-size:20px; font-weight:600; }
  button.op:hover, button.fn:hover{ border-color:rgba(201,160,78,.4); }
  button.fn{ color:var(--bone-dim); font-size:14px; letter-spacing:.05em; text-transform:uppercase; }
  button.equals{
    grid-column: span 2;
    background: linear-gradient(180deg, #d3ab5c 0%, #a9793a 100%);
    color:#181205; font-weight:700; letter-spacing:.06em; font-size:16px;
    border:none;
  }
  button.equals:active{ transform: scale(.97); }

  .legend{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; gap:6px;
    color:var(--bone-dim); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  }
  .legend img{ height:18px; width:auto; opacity:.75; }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <span class="brand-name">Cipher</span>
    <span class="brand-mark">✦</span>
  </div>

  <div class="display" id="display">
    <div class="display-ghost" id="ghost">&nbsp;</div>
    <div class="display-main" id="main"></div>
  </div>

  <div class="pad" id="pad">
    <button class="fn" data-action="clear">Clear</button>
    <button class="fn" data-action="back">⌫</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-action="op" data-value="/">÷</button>

    <button data-digit="7"><img id="btn-7" alt="7"></button>
    <button data-digit="8"><img id="btn-8" alt="8"></button>
    <button data-digit="9"><img id="btn-9" alt="9"></button>
    <button class="op" data-action="op" data-value="*">×</button>

    <button data-digit="4"><img id="btn-4" alt="4"></button>
    <button data-digit="5"><img id="btn-5" alt="5"></button>
    <button data-digit="6"><img id="btn-6" alt="6"></button>
    <button class="op" data-action="op" data-value="-">−</button>

    <button data-digit="1"><img id="btn-1" alt="1"></button>
    <button data-digit="2"><img id="btn-2" alt="2"></button>
    <button data-digit="3"><img id="btn-3" alt="3"></button>
    <button class="op" data-action="op" data-value="+">+</button>

    <button data-digit="0"><img id="btn-0" alt="0"></button>
    <button class="fn" data-action="dot">•</button>
    <button class="equals" data-action="equals">=</button>
  </div>

  <div class="legend"><img id="legend-glyph" alt="glyph"> a cipher of ten glyphs</div>
</div>

<script>
(function(){
  // wire up button images
  for(let i=0;i<10;i++){
    document.getElementById('btn-'+i).src = GLYPHS[i];
  }
  document.getElementById('legend-glyph').src = GLYPHS[6];

  let expr = "";
  let justEvaluated = false;

  const mainEl = document.getElementById('main');
  const ghostEl = document.getElementById('ghost');
  const opSymbols = { '+':'+', '-':'−', '*':'×', '/':'÷' };

  function renderMain(str){
    mainEl.innerHTML = "";
    for(const ch of str){
      if(ch >= '0' && ch <= '9'){
        const img = document.createElement('img');
        img.src = GLYPHS[ch];
        img.alt = ch;
        mainEl.appendChild(img);
      } else if(ch === '.'){
        const span = document.createElement('span');
        span.className = 'dot-char';
        span.textContent = '·';
        mainEl.appendChild(span);
      } else if(opSymbols[ch]){
        const span = document.createElement('span');
        span.className = 'op-char';
        span.textContent = opSymbols[ch];
        mainEl.appendChild(span);
      }
    }
    mainEl.scrollLeft = mainEl.scrollWidth;
  }

  function lastNumberSegment(str){
    const m = str.match(/(\d+\.?\d*)$/);
    return m ? m[0] : "";
  }

  function refresh(){
    if(expr === ""){
      renderMain("0");
      ghostEl.innerHTML = "&nbsp;";
      return;
    }
    renderMain(expr);
    ghostEl.textContent = "";
  }

  function safeEval(str){
    if(!/^[0-9+\-*/.\s]+$/.test(str)) return null;
    try{
      const val = Function('"use strict"; return (' + str + ')')();
      if(typeof val !== 'number' || !isFinite(val)) return null;
      return Math.round(val * 1e10) / 1e10;
    }catch(e){ return null; }
  }

  document.getElementById('pad').addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;

    if(btn.dataset.digit !== undefined){
      if(justEvaluated){ expr = ""; justEvaluated = false; }
      const seg = lastNumberSegment(expr);
      if(seg === "0"){ expr = expr.slice(0, -1) + btn.dataset.digit; }
      else { expr += btn.dataset.digit; }
      refresh();
      return;
    }

    const action = btn.dataset.action;
    if(action === 'op'){
      if(expr === "" && btn.dataset.value !== '-') return;
      justEvaluated = false;
      const lastChar = expr.slice(-1);
      if('+-*/'.includes(lastChar)){
        expr = expr.slice(0, -1) + btn.dataset.value;
      } else {
        expr += btn.dataset.value;
      }
      refresh();
    } else if(action === 'dot'){
      justEvaluated = false;
      const seg = lastNumberSegment(expr);
      if(seg.includes('.')) return;
      expr += (seg === "" ? "0." : ".");
      refresh();
    } else if(action === 'clear'){
      expr = ""; justEvaluated = false; refresh();
    } else if(action === 'back'){
      justEvaluated = false;
      expr = expr.slice(0, -1);
      refresh();
    } else if(action === 'percent'){
      const seg = lastNumberSegment(expr);
      if(seg === "") return;
      const val = (parseFloat(seg) / 100).toString();
      expr = expr.slice(0, expr.length - seg.length) + val;
      refresh();
    } else if(action === 'equals'){
      if(expr === "") return;
      const result = safeEval(expr);
      if(result === null){
        ghostEl.textContent = "cannot resolve";
        return;
      }
      ghostEl.textContent = expr + " =";
      expr = result.toString();
      justEvaluated = true;
      renderMain(expr);
    }
  });

  document.addEventListener('keydown', function(e){
    if(/^[0-9]$/.test(e.key)){
      document.querySelector('[data-digit="'+e.key+'"]').click();
    } else if(['+','-','*','/'].includes(e.key)){
      document.querySelector('[data-action="op"][data-value="'+e.key+'"]').click();
    } else if(e.key === '.'){
      document.querySelector('[data-action="dot"]').click();
    } else if(e.key === 'Enter' || e.key === '='){
      document.querySelector('[data-action="equals"]').click();
    } else if(e.key === 'Backspace'){
      document.querySelector('[data-action="back"]').click();
    } else if(e.key === 'Escape'){
      document.querySelector('[data-action="clear"]').click();
    }
  });

  refresh();
})();
</script>
